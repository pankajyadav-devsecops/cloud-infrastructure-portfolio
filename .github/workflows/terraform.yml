name: 'Azure Terraform CI/CD'

on:
  push:
    branches:
      - 'feature/test-pipeline'
      - 'main'
  pull_request:
    branches:
      - 'main'

# Azure OIDC Authentication ke liye permissions ਜ਼ਰੂਰੀ hain
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ==========================================
  # STAGE 1: Feature Branch & PR CI (Init, Validate, Plan)
  # ==========================================
  terraform-plan:
    name: 'Terraform Init, Validate & Plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environment/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format & Validate
        run: |
          terraform fmt -check
          terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      # Plan output ko artifact ke taur par save karte hain taaki Apply stage ise use kar sake
      - name: Save Terraform Plan Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: environment/dev/tfplan

  # ==========================================
  # STAGE 2: Manual Approval & Terraform Apply (Only for Main Branch)
  # ==========================================
  terraform-apply:
    name: 'Terraform Approval & Apply'
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev-approval # Ye GitHub Environment manual approval trigger karega
    defaults:
      run:
        working-directory: environment/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: environment/dev

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true